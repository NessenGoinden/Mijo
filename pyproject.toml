[project]
name = "nourriture"
version = "0.1.0"
description = "Transforme des liens Instagram de recettes en bibliothèque locale et génère des menus de la semaine. 100 % local et gratuit."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pywebview>=5.1",
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1",
    "av>=15,<16",
    "pillow>=10",
    "pyobjc-core>=10",
    "pyobjc-framework-Cocoa>=10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-Vision>=10",
    "pyobjc-framework-WebKit>=10",
]

[project.scripts]
nourriture = "nourriture.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nourriture"]
